<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaSearch · 画面搜索</title>
<style>
:root{--bg:#14161a;--panel:#1c1f26;--line:#2a2e38;--txt:#e8eaed;--dim:#9aa0ab;
--acc:#4da3ff;--ok:#42d392;--warn:#ffb04d;--bad:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
header h1{font-size:18px;margin:0}header .sub{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);padding:16px}
h2{font-size:13px;color:var(--dim);margin:18px 0 8px;letter-spacing:.05em}
h2:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>label{flex:0 0 92px;color:var(--dim);font-size:13px}

input[type=text],input[type=number],select{width:100%;background:var(--panel);color:var(--txt);
border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
#q{padding:10px 12px;font-size:15px}
#q::placeholder{color:var(--dim)}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);
border-radius:6px;padding:7px 12px;font:inherit}
button.pri{background:var(--acc);border-color:var(--acc);color:#08111f;font-weight:700}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
label.ck{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}
label.ck input{accent-color:var(--acc);width:15px;height:15px}
.scope-path{color:var(--dim);font-size:11px;word-break:break-all;margin-left:23px}
#saveHint{color:var(--ok);font-size:12px;min-height:16px}
#buildBar{height:10px;background:var(--panel);border-radius:5px;overflow:hidden;display:none}
#buildBar i{display:block;height:100%;width:0%;background:var(--acc);transition:width .4s}
#buildInfo{font-size:12px;color:var(--dim);word-break:break-all}
.st{display:flex;justify-content:space-between;margin:3px 0;font-size:13px}
.st b{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.idle{background:var(--dim)}.dot.loading{background:var(--warn);animation:bl 1s infinite}
.dot.loaded{background:var(--ok)}@keyframes bl{50%{opacity:.3}}
#events{font-size:11px;color:var(--dim);word-break:break-all;max-height:90px;overflow:auto}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card .th{height:110px;background:#0d0f13;display:flex;align-items:center;justify-content:center;
font-size:30px;overflow:hidden}
.card .th img,.card .th video{width:100%;height:100%;object-fit:contain}
.card .bd{padding:9px 10px}
.card .score{font-size:20px;font-weight:700}
.card .meta{font-size:11px;color:var(--dim)}
.card .path{font:11px Consolas,monospace;color:var(--dim);word-break:break-all;margin-top:4px;cursor:pointer}
.card .path:hover{color:var(--acc)}
#resInfo{padding:0 16px 6px;color:var(--dim);font-size:12px}
.empty{padding:40px;color:var(--dim);text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#lb.on{display:flex}
#lb img,#lb video{max-width:92vw;max-height:78vh;object-fit:contain;background:#0d0f13;border-radius:8px}
#lb .bar{display:flex;gap:8px;align-items:center;max-width:92vw}
#lb .lp{color:var(--dim);font-size:12px;word-break:break-all;flex:1}
aside.hide{display:none}
main.nowide{grid-template-columns:1fr}
@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>🔍 MediaSearch</h1>
  <span class="sub">画面搜索引擎 · 搜的是内容不是文件名 · 127.0.0.1:8686</span>
  <button id="tgl" style="margin-left:auto">☰ 侧栏</button>
</header>
<main>
<aside id="side">
  <h2>媒体库（勾选 = 参与搜索）</h2>
  <div id="scopes"></div>
  <div class="row">
    <button id="addScope" style="flex:1" title="粘贴文件夹路径，点确定后立即自动建库，把里面的图/视频收入库">＋ 加新库</button>
    <button id="build" style="flex:1" title="文件夹里新加了图片/视频后点它，只把新内容补进库，已入库的不重复建">补建新文件</button>
  </div>
  <div id="buildBar"><i></i></div>
  <div id="buildInfo"></div>

  <details open><summary style="cursor:pointer;font-size:13px;color:var(--dim);letter-spacing:.05em">参数面板（即改即生效 → settings.json）</summary>
  <div class="row"><label>返回条数</label><input type="number" id="p-topn" min="1" max="200" style="width:70px" title="一次最多显示几条结果"></div>
  <div class="row"><label>向量维度</label><select id="p-dim" style="width:90px" title="越大越准；一般不用改"><option value="2048">2048（全）</option><option value="1024">1024</option><option value="512">512</option><option value="256">256</option></select></div>
  <div class="row"><label>相似度门槛</label><input type="number" id="p-min" step="0.05" min="0" max="1" style="width:70px" title="低于此相似度的不显示；搜不到就调低，结果太杂就调高"></div>
  <div class="row"><label>闲置释放(分钟)</label><input type="number" id="p-idle" min="0" style="width:70px" title="无操作几分钟后自动释放显存；0=不自动释放"></div>
  <div class="row"><label>显存上限(GB)</label><input type="number" id="p-cap" min="0" max="64" style="width:70px" title="显存预算：0=纯CPU；6=权重进显存全速跑；更大=建库更吃显存更快；装不下自动卸运存变慢。下次加载生效"></div>
  <div id="saveHint"></div>
  </details>
  <div class="row"><button id="resetDef" style="width:100%">恢复默认参数</button></div>

  <h2>服务状态</h2>
  <div class="st"><span>模型</span><b id="st-model"><span class="dot idle"></span>未知</b></div>
  <div class="st"><span>显存占用</span><b id="st-vram">—</b></div>
  <div class="st"><span>库件数</span><b id="st-items">—</b></div>
  <div class="st"><span>库来源</span><b id="st-lib">—</b></div>
  <h2>最近事件</h2>
  <div id="events"></div>
</aside>

<section>
  <div style="padding:14px 14px 4px;display:flex;gap:8px">
    <input id="q" placeholder="输入要搜的名词或一句话，搜画面内容…">
    <button class="pri" id="go" style="white-space:nowrap">搜索</button>
  </div>
  <div id="resInfo"></div>
  <div id="results"><div class="empty">在上面输入要搜的名词或一句话，点搜索</div></div>
</section>
</main>
<div id="lb"><div id="lbc"></div><div class="bar"><span class="lp" id="lbp"></span><button id="lbrv">在文件夹中显示</button><button id="lbcp">复制路径</button></div></div>

<script>
const $=id=>document.getElementById(id);
const checked=()=>[...document.querySelectorAll("#scopes input:checked")].map(i=>i.value);

async function api(p,body,method){
  let opts;
  if(method)opts={method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})};
  else if(body)opts={method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(p,opts);
  if(!r.ok){let m;try{m=(await r.json()).detail}catch(e){m=r.statusText}throw new Error(m)}
  return r.json()
}

async function loadScopes(){
  const d=await api("/scopes");
  $("scopes").innerHTML="";
  d.scopes.forEach(s=>{
    const l=document.createElement("label");l.className="ck";
    l.innerHTML=`<input type="checkbox" value="${s.id}" ${s.enabled?"checked":""}> ${s.name}（${s.count??0}）`;
    const p=document.createElement("div");p.className="scope-path";p.textContent=s.path;
    const ck=l.querySelector("input");
    ck.onchange=e=>api("/scopes",{id:s.id,enabled:e.target.checked},"PUT")
      .then(loadScopes).catch(showErr);
    const rm=document.createElement("button");rm.textContent="移除";rm.title="删除此库的登记与向量档案（不会删硬盘文件），需输入「确定删除」确认";
    rm.style.cssText="font-size:11px;padding:2px 8px;margin:2px 0 8px;color:var(--dim)";
    rm.onclick=()=>{
      const w=prompt("移除「"+s.name+"」将删掉它的登记和向量档案（硬盘文件不受影响）。\n建库很慢，误删要重来。\n\n请输入「确定删除」四个字以确认：");
      if(w!=="确定删除")return;
      api("/remove-scope",{id:s.id,delete_vectors:true}).then(()=>{loadScopes();poll()}).catch(showErr);
    };
    $("scopes").append(l,p,rm);
  });
}
$("addScope").title="浏览器限制：需粘贴文件夹完整路径（如 D:\\照片）；点确定后立即自动建库";
$("addScope").onclick=()=>{
  const path=prompt("粘贴文件夹完整路径（只索引其中的图/视频，可含子夹）：\n\n点确定后会立即自动开始建库。");
  if(!path)return;
  $("addScope").disabled=true;$("build").disabled=true;
  api("/add-scope",{path:path.trim()}).then(d2=>{
    loadScopes();
    return api("/embed-scope",{scope:d2.id});
  }).then(d2=>{
    $("buildInfo").textContent="建库中… "+d2.total+" 件待嵌（图≈1.2s/件，视频 4-15s/件）";
    $("buildBar").style.display="block";
  }).catch(showErr);
};
$("build").onclick=()=>{
  $("addScope").disabled=true;$("build").disabled=true;
  const sc=checked();
  api("/embed-scope",sc.length?{scope:sc}:{}).then(d=>{
    $("buildInfo").textContent="建库中… "+d.total+" 件待嵌（图≈1.2s/件，视频 4-15s/件）";
    $("buildBar").style.display="block";
  }).catch(showErr);
};

async function poll(){
  try{
    const s=await api("/status");
    const dot={idle:"idle",loading:"loading",loaded:"loaded"}[s.model]||"idle";
    $("st-model").innerHTML=`<span class="dot ${dot}"></span>${s.model==="loaded"?"已加载":s.model==="loading"?"热身中":"待命(首搜JIT热身)"}`;
    $("st-vram").textContent=s.model==="loaded"?s.vram_mb+" MB":"0（闲置 "+(s.settings?.idle_release_min||0)+" 分自动释放）";
    $("st-items").textContent=s.items;
    $("st-lib").textContent={new:"新库 data/embeddings.json",fallback:"兜底库（fallback_library）",none:"无库"}[s.lib]||s.lib;
    $("events").innerHTML=(s.events||[]).map(e=>"· "+e).join("<br>");
    const b=s.building;
    if(b&&b.state==="running"){
      $("buildBar").style.display="block";
      $("buildBar").firstElementChild.style.width=(b.total?Math.round(100*b.done/b.total):0)+"%";
      $("buildInfo").textContent=`建库 ${b.done}/${b.total}  ${b.cur||""}`;
    }else if(b&&b.state==="done"){
      $("buildBar").firstElementChild.style.width="100%";
      $("buildInfo").textContent="建库完成 "+(b.finished||"");
      setTimeout(()=>$("buildBar").style.display="none",4000);
      loadScopes().catch(()=>{});
    }else if(b&&b.state==="error"){
      $("buildBar").style.display="none";$("buildInfo").textContent="建库失败："+b.err;
    }
    const busy=b&&b.state==="running";
    $("addScope").disabled=busy;$("build").disabled=busy;
    if(s.vram_total_mb)VT=s.vram_total_mb;
    if(s.settings){
      const set=(id,v)=>{const el=$(id);if(document.activeElement!==el)el.value=v};
      set("p-topn",s.settings.topn);set("p-dim",String(s.settings.dim));
      set("p-min",s.settings.min_score);set("p-idle",s.settings.idle_release_min);
      set("p-cap",s.settings.gpu_cap_gib??6);
    }
  }catch(e){}
}
setInterval(poll,2000);

let saveT=null;
let VT=0;
function saveSettings(){
  const cap=+$("p-cap").value||6;
  if(VT&&cap*1024>VT&&!confirm("你的显卡总显存约 "+(VT/1024).toFixed(1)+"GB，填 "+cap+"GB 超出部分会挤进内存，速度大幅变慢甚至加载失败。\n确定要设为 "+cap+"GB 吗？")){$("p-cap").value=6;return;}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      await api("/settings",{topn:+$("p-topn").value||5,dim:+$("p-dim").value,
        min_score:+$("p-min").value,idle_release_min:+$("p-idle").value,
        gpu_cap_gib:+$("p-cap").value||6},"PUT");
      $("saveHint").textContent="✓ 已保存 settings.json，即改即生效";
    }catch(e){$("saveHint").textContent="保存失败："+e.message}
  },300);
}
["p-topn","p-dim","p-min","p-idle","p-cap"].forEach(id=>$(id).addEventListener("change",saveSettings));

$("resetDef").addEventListener("click",async()=>{
  try{
    await api("/settings",{topn:20,dim:2048,min_score:0.2,idle_release_min:30,gpu_cap_gib:6},"PUT");
    $("saveHint").textContent="✓ 已恢复默认参数";
    poll();
  }catch(e){$("saveHint").textContent="恢复失败："+e.message}
});

function checkedList(){const c=checked();return c.length?c:"all"}
async function doSearch(q){
  if(!checked().length){alert("请先在左侧「媒体库」勾选至少 1 个库（勾选 = 参与搜索）");return;}
  $("go").disabled=true;$("go").textContent="搜…";
  try{
    const sc=checkedList();
    const d=await api("/search",{q:q,scope:sc});
    $("resInfo").textContent=`“${q}” · ${d.results.length} 条 · ${d.ms}ms · 库:${d.lib} · 范围:${Array.isArray(sc)?sc.join(","):sc}`;
    $("resInfo").style.color="";
    const R=$("results");R.innerHTML="";
    if(!d.results.length)R.innerHTML='<div class="empty">没有结果（试试调低「相似度门槛」）</div>';
    d.results.forEach(r=>{
      const c=document.createElement("div");c.className="card";
      const img=r.modality==="image"
        ?`<img loading="lazy" src="/file?path=${encodeURIComponent(r.path)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'图片缺失',style:'font-size:11px;color:var(--dim)'}))">`
        :`<video preload="metadata" muted src="/file?path=${encodeURIComponent(r.path)}#t=0.5" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'🎬',style:'font-size:34px'}))"></video>`;
      c.innerHTML=`<div class="th">${img}</div><div class="bd">
        <div class="score">${r.score.toFixed(3)}</div>
        <div class="meta">${r.modality==="image"?"图":"视频"} · 范围 ${r.scope}</div>
        <div class="path"></div></div>`;
      const pathEl=c.querySelector(".path");
      pathEl.textContent=r.path;pathEl.title="在文件夹中显示该文件";
      pathEl.onclick=()=>openReveal(r.path);
      const thEl=c.querySelector(".th");thEl.style.cursor="zoom-in";
      thEl.title="点击放大/播放";thEl.onclick=()=>openLightbox(r);
      R.append(c);
    });
  }catch(e){$("resInfo").textContent="";$("results").innerHTML='<div class="empty">'+e.message+"</div>"}
  finally{$("go").disabled=false;$("go").textContent="搜索"}
}
$("go").onclick=()=>doSearch($("q").value.trim());
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("q").value.trim())doSearch($("q").value.trim())});
function showErr(m){if(typeof m==="string"&&m!==""){const el=$("resInfo");el.textContent="⚠ "+m;el.style.color="var(--err,#ff6b6b)";el.scrollIntoView&&el.scrollIntoView({block:"nearest"});}}

let lbPath="";
function openLightbox(r){
  lbPath=r.path;
  const C=$("lbc");C.innerHTML="";
  if(r.modality==="image"){const im=new Image();im.src="/file?path="+encodeURIComponent(r.path);C.appendChild(im);}
  else{const v=document.createElement("video");v.controls=true;v.autoplay=true;v.src="/file?path="+encodeURIComponent(r.path);C.appendChild(v);}
  $("lbp").textContent=r.path;
  $("lb").classList.add("on");
}
function closeLightbox(){$("lb").classList.remove("on");$("lbc").innerHTML="";}
async function openReveal(p){
  try{await api("/reveal",{path:p});}
  catch(e){alert("在文件夹中显示失败："+e.message)}
}
$("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLightbox()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox()});
$("lbrv").onclick=()=>openReveal(lbPath);
$("lbcp").onclick=async()=>{try{await navigator.clipboard.writeText(lbPath);$("lbcp").textContent="已复制";setTimeout(()=>$("lbcp").textContent="复制路径",1200);}catch(e){}};

$("tgl").onclick=()=>{$("side").classList.toggle("hide");document.querySelector("main").classList.toggle("nowide")};

loadScopes().catch(showErr);poll();
</script>
</body>
</html>
